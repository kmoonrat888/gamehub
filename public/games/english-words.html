<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมคำศัพท์ภาษาอังกฤษ</title>
<style>
  :root {
    --bg1: #dfe5ff;
    --bg2: #d3efff;
    --bg3: #d2f5ec;
    --card: #ffffff;
    --ink: #33295a;
    --muted: #6d6590;
    --primary: #ff7a59;
    --green: #2fb874;
    --red: #f2506a;
    --yellow: #ffc93c;
    --blue: #4d8dff;
    --purple: #9a6cff;
    --orange: #ff9f1c;
    --soft: #f2effb;
    --shadow: 0 8px 0 rgba(51, 41, 90, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    min-height: 100%;
    font-family: "Leelawadee UI", "Segoe UI", "Tahoma", "Noto Sans Thai", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    width: 100%;
    max-width: 580px;
    background: var(--card);
    border-radius: 32px;
    box-shadow: var(--shadow), 0 20px 40px rgba(0, 0, 0, 0.08);
    padding: 26px 24px;
    text-align: center;
    animation: pop 0.35s ease;
  }

  .hidden { display: none !important; }

  h1 { font-size: clamp(26px, 7vw, 38px); margin-bottom: 2px; }
  .subtitle { font-size: 17px; opacity: 0.75; margin-bottom: 20px; }
  .mascot { font-size: 64px; display: inline-block; animation: bounce 1.6s ease-in-out infinite; }

  .btn {
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
    transition: transform 0.08s, box-shadow 0.08s, background 0.2s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
  .btn:disabled { cursor: default; }

  /* ---------- หน้าตั้งค่า ---------- */
  .setting { margin-bottom: 18px; }
  .setting-label { font-size: 18px; font-weight: 700; text-align: left; margin: 0 4px 10px; }
  .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .options.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .option {
    background: var(--soft);
    color: var(--ink);
    border: 3px solid transparent;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
    font-size: 17px;
    padding: 8px 14px;
    border-radius: 16px;
  }
  .options.grid .option { padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .option small { font-size: 13px; font-weight: 600; opacity: 0.7; }
  .option.selected { background: #fff4d1; border-color: var(--yellow); animation: pop 0.25s ease; }
  .setting-note { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 8px; }
  .start-btn { width: 100%; font-size: 26px; padding: 16px; margin-top: 6px; background: var(--green); }

  /* ---------- หน้าเล่นเกม ---------- */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 18px;
    font-weight: 700;
  }
  .icon-btn {
    background: var(--soft);
    color: var(--ink);
    font-size: 22px;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
    flex-shrink: 0;
  }
  .score { background: #fff4d1; padding: 6px 14px; border-radius: 14px; }
  .progress { height: 14px; background: #eee9fb; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--yellow), var(--primary));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .prompt {
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .prompt .picture {
    width: min(100%, 250px);
    aspect-ratio: 1;
    border-radius: 24px;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: pop 0.4s ease;
  }
  .prompt .word {
    font-size: clamp(32px, 10vw, 52px);
    font-weight: 800;
    letter-spacing: 1px;
    overflow-wrap: anywhere;
    animation: pop 0.4s ease;
  }
  .prompt .question-text { font-size: 18px; font-weight: 700; opacity: 0.75; }
  .prompt .thai { font-size: 22px; font-weight: 800; color: var(--purple); }
  .speak-btn { background: var(--blue); font-size: 18px; padding: 6px 16px; border-radius: 14px; }

  /* รูปภาพ (SVG หรือ emoji) */
  .pic-svg { width: 100%; height: 100%; display: block; }
  .pic-emoji {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.1em;
    font-size: clamp(64px, 20vw, 96px);
    line-height: 1.1;
  }
  /* รูปถ่ายจริง: กรอบตามสัดส่วนภาพ + ชั้นวาดวงไฮไลต์ทับ (หมวดร่างกาย) */
  .photo-wrap { position: relative; width: 100%; height: 100%; }
  .photo-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .photo-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .picture, .choice-pic, .r-pic { display: flex; align-items: center; justify-content: center; }
  .credit {
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
    text-decoration: none;
    white-space: nowrap;
  }
  .options.grid.two { grid-template-columns: 1fr 1fr; }
  .net-note { font-size: 13px; font-weight: 600; color: var(--muted); margin: -6px 0 14px; }
  .hl {
    transform-box: fill-box;
    transform-origin: center;
    animation: hlpulse 0.9s ease-in-out infinite alternate;
  }

  .feedback { font-size: 22px; font-weight: 800; min-height: 32px; margin-bottom: 4px; }
  .feedback.good { color: var(--green); animation: pop 0.3s ease; }
  .feedback.bad { color: var(--red); animation: pop 0.3s ease; }
  .meaning { font-size: 19px; font-weight: 700; min-height: 28px; margin-bottom: 10px; line-height: 1.5; }
  .meaning .example { display: block; font-size: 16px; font-weight: 600; color: var(--muted); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .choice {
    font-size: clamp(22px, 6.5vw, 30px);
    padding: 18px 6px;
    background: var(--primary);
    position: relative;
    overflow-wrap: anywhere;
  }
  .choice.long { font-size: clamp(16px, 4.6vw, 22px); }
  .choice:nth-child(2) { background: var(--blue); }
  .choice:nth-child(3) { background: var(--purple); }
  .choice:nth-child(4) { background: var(--orange); }
  .choice.pic { padding: 6px; }
  .choice.pic .choice-pic {
    width: 100%;
    height: clamp(110px, 32vw, 150px);
    margin: 0 auto;
    border-radius: 14px;
    background: #fff;
    overflow: hidden;
  }
  .choice.pic .choice-pic .pic-emoji { font-size: clamp(38px, 11vw, 56px); }
  .choice .key {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 13px;
    opacity: 0.7;
    z-index: 1;
  }
  .choice.pic .key {
    top: 10px;
    left: 12px;
    padding: 0 6px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.45);
    opacity: 1;
  }
  .choice.correct { background: var(--green) !important; animation: pop 0.35s ease; }
  .choice.wrong { background: #c9c3d9 !important; animation: shake 0.4s ease; }
  .choice.pic.wrong .choice-pic { opacity: 0.35; }

  /* สะกดคำ */
  .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; margin-bottom: 18px; }
  .slot-word { display: flex; gap: 6px; }
  .slots.long .slot-word { gap: 3px; }
  .slot {
    width: 34px;
    height: 46px;
    border-bottom: 4px solid var(--ink);
    font-size: 28px;
    font-weight: 800;
    line-height: 44px;
  }
  .slot.fixed { border-bottom-color: transparent; color: var(--muted); }
  .slot.gap { width: 16px; }
  .slots.long { gap: 6px 14px; }
  .slots.long .slot { width: 22px; font-size: 22px; }
  .slots.long .slot.gap { width: 12px; }
  .slot.filled { color: var(--green); animation: pop 0.25s ease; }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .tile { width: 54px; height: 58px; font-size: 28px; background: var(--purple); }
  .tile.used { visibility: hidden; }
  .tile.wrong { animation: shake 0.4s ease; background: var(--red); }

  /* ---------- หน้าสรุปผล ---------- */
  .stars { font-size: 60px; margin: 8px 0; letter-spacing: 6px; }
  .stars span { display: inline-block; animation: pop 0.5s ease backwards; }
  .stars .off { filter: grayscale(1); opacity: 0.3; }
  .result-score { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  .result-msg { font-size: 19px; margin-bottom: 18px; }
  .review { text-align: left; background: #faf8ff; border-radius: 20px; padding: 14px; margin-bottom: 20px; }
  .review h2 { font-size: 19px; margin-bottom: 8px; text-align: center; }
  .review-row {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px dashed #e2dcf5;
  }
  .review-row:last-child { border-bottom: none; }
  .review-row .r-pic { width: 60px; height: 60px; border-radius: 12px; background: #fff; overflow: hidden; }
  .review-row .r-pic .pic-emoji { font-size: 26px; }
  .review-row .r-word { font-size: 19px; font-weight: 800; }
  .review-row .r-thai { font-size: 15px; opacity: 0.75; }
  .review-row .speak-btn { font-size: 16px; padding: 6px 10px; }
  .review .perfect { text-align: center; font-size: 18px; font-weight: 700; color: var(--green); }
  .result-actions { display: grid; gap: 12px; }
  .result-actions .btn { font-size: 22px; padding: 15px; }
  .btn-primary { background: var(--primary); }
  .btn-secondary { background: var(--blue); }

  .confetti {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 18px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 10;
    animation: fall linear forwards;
  }

  @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 70% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes bounce { 50% { transform: translateY(-12px); } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @keyframes hlpulse { from { transform: scale(0.9); opacity: 0.75; } to { transform: scale(1.08); opacity: 1; } }

  @media (max-width: 400px) {
    .screen { padding: 22px 16px; border-radius: 24px; }
    .slot { width: 28px; font-size: 24px; }
    .tile { width: 48px; height: 54px; font-size: 26px; }
  }
</style>
</head>
<body>

  <!-- หน้าตั้งค่า -->
  <section id="start-screen" class="screen">
    <div class="mascot" id="start-mascot">🔤</div>
    <h1 id="start-title">เกมคำศัพท์ภาษาอังกฤษ</h1>
    <p class="subtitle" id="start-subtitle"></p>
    <div id="settings"></div>
    <p class="net-note">📷 ใช้รูปถ่ายจริง ต้องต่ออินเทอร์เน็ต (ถ้าไม่มีเน็ตจะแสดงรูปวาดแทน)</p>
    <button class="btn start-btn" id="start-btn">▶️ เริ่มเล่น</button>
  </section>

  <!-- หน้าเล่นเกม -->
  <section id="game-screen" class="screen hidden">
    <div class="top-bar">
      <button class="btn icon-btn" id="home-btn" title="กลับหน้าตั้งค่า">🏠</button>
      <span id="counter">ข้อ 1/10</span>
      <span class="score">⭐ <span id="score">0</span></span>
      <button class="btn icon-btn" id="sound-btn" title="เปิด/ปิดเสียง">🔊</button>
    </div>
    <div class="progress"><div class="progress-fill" id="progress"></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="feedback" id="feedback"></div>
    <div class="meaning" id="meaning"></div>
    <div class="choices" id="choices"></div>
    <div id="spell" class="hidden">
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </section>

  <!-- หน้าสรุปผล -->
  <section id="result-screen" class="screen hidden">
    <div class="mascot" id="result-mascot">🏆</div>
    <div class="stars" id="stars"></div>
    <div class="result-score" id="result-score"></div>
    <p class="result-msg" id="result-msg"></p>
    <div class="review" id="review"></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="again-btn">🔁 เล่นอีกครั้ง</button>
      <button class="btn btn-secondary" id="settings-btn">⚙️ เปลี่ยนการตั้งค่า</button>
    </div>
  </section>

<script>
  // ======================================================================
  //  ภาพหมวดสี: หยดสี (Gold/Silver ใช้ไล่เฉดแบบโลหะ)
  // ======================================================================
  const SPLAT = "M150 34 C206 34 256 70 258 124 C260 170 232 196 238 236 C242 262 212 270 204 246 C196 224 182 230 168 240 C148 254 116 252 100 236 C88 224 74 238 60 228 C40 214 54 190 48 164 C40 126 58 86 92 60 C108 46 128 34 150 34 Z";

  function colorPic(w) {
    let fill = w.hex;
    let defs = "";
    if (w.metal) {
      const [light, mid, dark] = w.metal;
      defs = `<defs><linearGradient id="metal-${w.word}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light}"/><stop offset=".45" stop-color="${mid}"/><stop offset=".55" stop-color="${light}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs>`;
      fill = `url(#metal-${w.word})`;
    }
    const stroke = w.word === "white" ? `stroke="#b9b4cc" stroke-width="5"` : `stroke="rgba(0,0,0,.12)" stroke-width="3"`;
    const shine = w.word === "white" ? "" : `<ellipse cx="112" cy="88" rx="26" ry="14" fill="#fff" opacity=".35" transform="rotate(-30 112 88)"/>`;
    return `<svg class="pic-svg" viewBox="0 0 300 290" aria-hidden="true">${defs}<path d="${SPLAT}" fill="${fill}" ${stroke}/>${shine}</svg>`;
  }

  // ======================================================================
  //  ภาพหมวดร่างกาย: ภาพการ์ตูนพื้นฐาน + วงไฮไลต์และลูกศรชี้
  // ======================================================================
  const SKIN = "#FFD9B8";
  const OUT = "#C98A5E";
  const HAIR = "#4A2F1D";
  const SHORTS = "#4D8DFF";
  const sk = `fill="${SKIN}" stroke="${OUT}" stroke-width="2.5"`;
  const limb = (d, w = 18) =>
    `<path d="${d}" stroke="${OUT}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>` +
    `<path d="${d}" stroke="${SKIN}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  const smallFace = (cx, cy) =>
    `<circle cx="${cx - 11}" cy="${cy + 2}" r="3" fill="#2B2340"/><circle cx="${cx + 11}" cy="${cy + 2}" r="3" fill="#2B2340"/>` +
    `<path d="M${cx - 9} ${cy + 14} Q${cx} ${cy + 21} ${cx + 9} ${cy + 14}" stroke="#7A2E2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;

  // จุดบนเส้นโค้งกำลังสอง (ใช้วางฟันตามแนวเหงือก)
  const qpt = (p0, p1, p2, t) => [
    (1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * p1[0] + t ** 2 * p2[0],
    (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * p1[1] + t ** 2 * p2[1],
  ];
  const UPPER = [[58, 128], [150, 88], [242, 128]];   // แนวขอบล่างเหงือกบน
  const LOWER = [[80, 196], [150, 226], [220, 196]];  // แนวขอบบนเหงือกล่าง

  const BODY_SCENES = {
    // ภาพเต็มตัวด้านหน้า
    front: `
      ${limb("M114 108 L98 152 L84 196")}${limb("M186 108 L202 152 L216 196")}
      <circle cx="83" cy="204" r="11" ${sk}/><circle cx="217" cy="204" r="11" ${sk}/>
      <rect x="120" y="200" width="24" height="84" rx="11" ${sk}/><rect x="156" y="200" width="24" height="84" rx="11" ${sk}/>
      <ellipse cx="128" cy="288" rx="17" ry="8" ${sk}/><ellipse cx="172" cy="288" rx="17" ry="8" ${sk}/>
      <path d="M125 250 q7 5 14 0 M161 250 q7 5 14 0" stroke="${OUT}" stroke-width="2" fill="none"/>
      <rect x="140" y="72" width="20" height="32" ${sk}/>
      <path d="M112 102 Q150 92 188 102 L185 194 Q150 200 115 194 Z" ${sk}/>
      <path d="M128 130 q10 6 20 0 M152 130 q10 6 20 0" stroke="${OUT}" stroke-width="2" fill="none" opacity=".6"/>
      <ellipse cx="150" cy="167" rx="2.5" ry="3.5" fill="${OUT}"/>
      <path d="M114 186 L186 186 L184 224 L155 224 L150 210 L145 224 L116 224 Z" fill="${SHORTS}"/>
      <circle cx="119" cy="50" r="7" ${sk}/><circle cx="181" cy="50" r="7" ${sk}/>
      <circle cx="150" cy="46" r="30" ${sk}/>
      <path d="M120 42 Q118 12 150 12 Q182 12 180 42 Q172 26 150 26 Q128 26 120 42 Z" fill="${HAIR}"/>
      ${smallFace(150, 46)}`,

    // ภาพด้านหลัง
    back: `
      ${limb("M114 108 L98 152 L84 196")}${limb("M186 108 L202 152 L216 196")}
      <circle cx="83" cy="204" r="11" ${sk}/><circle cx="217" cy="204" r="11" ${sk}/>
      <rect x="120" y="200" width="24" height="84" rx="11" ${sk}/><rect x="156" y="200" width="24" height="84" rx="11" ${sk}/>
      <ellipse cx="132" cy="256" rx="13" ry="17" ${sk}/><ellipse cx="168" cy="256" rx="13" ry="17" ${sk}/>
      <ellipse cx="128" cy="287" rx="13" ry="9" ${sk}/><ellipse cx="172" cy="287" rx="13" ry="9" ${sk}/>
      <rect x="140" y="72" width="20" height="32" ${sk}/>
      <path d="M112 102 Q150 92 188 102 L185 194 Q150 200 115 194 Z" ${sk}/>
      <path d="M150 108 L150 184 M126 120 q10 12 20 4 M174 120 q-10 12 -20 4" stroke="${OUT}" stroke-width="2" fill="none" opacity=".6"/>
      <path d="M114 186 L186 186 L184 224 L155 224 L150 210 L145 224 L116 224 Z" fill="${SHORTS}"/>
      <path d="M150 190 L150 212 M126 206 q12 8 22 2 M152 208 q10 6 22 -2" stroke="#2f63c9" stroke-width="2" fill="none"/>
      <circle cx="119" cy="50" r="7" ${sk}/><circle cx="181" cy="50" r="7" ${sk}/>
      <circle cx="150" cy="46" r="30" ${sk}/>
      <path d="M120 48 Q118 12 150 12 Q182 12 180 48 Q178 74 150 76 Q122 74 120 48 Z" fill="${HAIR}"/>`,

    // ภาพใบหน้าใกล้ ๆ
    face: `
      <path d="M118 212 L118 300 L182 300 L182 212 Z" ${sk}/>
      <path d="M143 268 q7 -9 14 0" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="58" cy="140" rx="17" ry="26" ${sk}/><ellipse cx="242" cy="140" rx="17" ry="26" ${sk}/>
      <path d="M60 126 q-8 12 0 26 M240 126 q8 12 0 26" stroke="${OUT}" stroke-width="2" fill="none"/>
      <ellipse cx="150" cy="134" rx="88" ry="98" ${sk}/>
      <path d="M64 118 Q58 28 150 26 Q242 28 236 118 Q228 66 150 62 Q72 66 64 118 Z" fill="${HAIR}"/>
      <path d="M96 100 Q115 90 134 100 M166 100 Q185 90 204 100" stroke="${HAIR}" stroke-width="7" stroke-linecap="round" fill="none"/>
      <ellipse cx="115" cy="126" rx="16" ry="11" fill="#fff" stroke="${OUT}" stroke-width="2"/>
      <ellipse cx="185" cy="126" rx="16" ry="11" fill="#fff" stroke="${OUT}" stroke-width="2"/>
      <circle cx="115" cy="127" r="7" fill="#5a3a22"/><circle cx="185" cy="127" r="7" fill="#5a3a22"/>
      <circle cx="115" cy="127" r="3.5" fill="#111"/><circle cx="185" cy="127" r="3.5" fill="#111"/>
      <path d="M99 123 Q115 109 131 123 M169 123 Q185 109 201 123" stroke="${OUT}" stroke-width="3" fill="none"/>
      <path d="M102 117 l-5 -6 M109 113 l-2 -7 M117 112 l1 -7 M125 114 l3 -6 M172 117 l-5 -6 M179 113 l-2 -7 M187 112 l1 -7 M195 114 l3 -6" stroke="#2B2340" stroke-width="2.2" stroke-linecap="round"/>

  // วงไฮไลต์ + ลูกศรชี้ไปยังอวัยวะ
  function highlight(w) {
    const { x, y } = w;
    const rx = w.rx || w.r;
    const ry = w.ry || w.r;
    const shape = `<ellipse class="hl" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="rgba(255,59,92,.14)" stroke="#FF3B5C" stroke-width="5"/>`;
    if (w.noArrow) return shape;
    const dirX = x < 150 ? -1 : 1;
    let sx = x + dirX * 70;
    let sy = y < 70 ? y + 52 : y - 52;
    sx = Math.min(292, Math.max(8, sx));
    sy = Math.min(292, Math.max(8, sy));
    const dx = sx - x, dy = sy - y;
    const len = Math.hypot(dx, dy) || 1;
    const rEdge = Math.min(rx, ry) + (Math.max(rx, ry) - Math.min(rx, ry)) * Math.abs(dx / len) * (rx > ry ? 1 : 0) + 6;
    const ex = x + (dx / len) * rEdge, ey = y + (dy / len) * rEdge;
    return `${shape}<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#FF3B5C" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>`;
  }

  // ======================================================================
  const SETTINGS = [
    {
      key: "cat", label: "1. หมวดคำศัพท์", grid: "two",
      options: Object.entries(CATEGORIES).map(([value, c]) => ({ value, label: `${c.emoji} ${c.title.replace("ภาษาอังกฤษ", "")}`, sub: `${c.words.length} คำ` })),
    },
    {
      key: "qtype", label: "2. รูปแบบคำถาม", grid: true,
      options: [
        { value: "pic", label: "🖼️ ดูรูป", sub: "เลือกคำศัพท์" },
        { value: "word", label: "🔤 ดูคำศัพท์", sub: "เลือกรูป" },
        { value: "spell", label: "🧩 สะกดคำ", sub: "เรียงตัวอักษร" },
      ],
    },
    {
      key: "count", label: "3. จำนวนข้อ",
      options: [5, 10, 15, 20].map((n) => ({ value: n, label: `${n} ข้อ` })).concat({ value: 0, label: "ทั้งหมด" }),
    },
  ];

  const SETTINGS_KEY = "english-words-settings";
  const PRAISES = ["เก่งมาก! 🎉", "ยอดเยี่ยม! 🌟", "ถูกต้อง! 👏", "Great job! 🚀", "Excellent! 💯"];
  const TRY_AGAIN = ["ลองใหม่นะ 💪", "เกือบแล้ว! ลองอีกที 🤔", "ไม่เป็นไร ลองใหม่ 😊"];

  const state = {
    settings: { cat: "colors", qtype: "pic", count: 10 },
    soundOn: true,
    questions: [],
    index: 0,
    score: 0,
    missed: [],
    firstTry: true,
    locked: false,
    round: 0,
    spellPos: 0,
  };

  const $ = (id) => document.getElementById(id);
  const screens = { start: $("start-screen"), game: $("game-screen"), result: $("result-screen") };
  const category = () => CATEGORIES[state.settings.cat];

  function showScreen(name) {
    Object.values(screens).forEach((s) => s.classList.add("hidden"));
    screens[name].classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ---------- รูปถ่ายจริง ----------
  const THUMB_BASE = "https://upload.wikimedia.org/wikipedia/commons/thumb";
  const fileOf = (path) => path.split("/").pop().split("?")[0];

  // รูปของคำนี้: { src, w, h, overlay? } หรือ null ถ้าไม่มี
  function photoOf(item) {
    const cat = state.settings.cat;
    let entry, mark;
    if (cat === "body") {
      const spec = BODY_PHOTOS[item.word];
      if (!spec) return null;
      entry = PHOTOS.bodyScenes[spec[0]];
      mark = spec;
    } else {
      entry = (PHOTOS[cat] || {})[item.word];
    }
    if (!entry) return null;
    const [path, w, h] = entry;
    const src = path.startsWith("http") ? path : `${THUMB_BASE}/${path}/500px-${fileOf(path)}`;
    const page = path.startsWith("http") ? path : `https://commons.wikimedia.org/wiki/File:${fileOf(path)}`;
    return { src, page, w, h, mark };
  }

  // วงไฮไลต์ + ลูกศรบนรูปถ่าย (พิกัดเป็น % ของภาพ, viewBox กว้าง 100)
  function photoMark(mark, w, h) {
    const H = (100 * h) / w;
    const [, px, py, size] = mark;
    const opts = typeof size === "object" ? size : { r: size };
    const x = px, y = (py / 100) * H;
    const rx = opts.rx || opts.r;
    const ry = opts.ry ? (opts.ry / 100) * H : opts.r;
    const sw = 1.6;
    let svg = `<svg viewBox="0 0 100 ${H.toFixed(2)}" aria-hidden="true">
      <defs><marker id="ph-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FF3B5C"/></marker></defs>
      <ellipse class="hl" cx="${x}" cy="${y.toFixed(2)}" rx="${rx}" ry="${ry.toFixed(2)}" fill="rgba(255,59,92,.15)" stroke="#fff" stroke-width="${sw + 1.4}"/>
      <ellipse class="hl" cx="${x}" cy="${y.toFixed(2)}" rx="${rx}" ry="${ry.toFixed(2)}" fill="none" stroke="#FF3B5C" stroke-width="${sw}"/>`;
    if (!opts.noArrow) {
      const dirX = x < 50 ? 1 : -1; // ลูกศรมาจากฝั่งที่มีที่ว่างมากกว่า
      let sx = x + dirX * 24;
      let sy = y < H * 0.3 ? y + 20 : y - 20;
      sx = Math.min(97, Math.max(3, sx));
      sy = Math.min(H - 3, Math.max(3, sy));
      const dx = sx - x, dy = sy - y, len = Math.hypot(dx, dy) || 1;
      const edge = Math.max(rx, ry) + 2;
      const ex = x + (dx / len) * edge, ey = y + (dy / len) * edge;
      const line = `x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"`;
      svg += `<line ${line} stroke="#fff" stroke-width="${sw + 1.8}" stroke-linecap="round"/>
              <line ${line} stroke="#FF3B5C" stroke-width="${sw + 0.4}" stroke-linecap="round" marker-end="url(#ph-arrow)"/>`;
    }
    return svg + "</svg>";
  }

  function picture(item, className) {
    const box = el("div", className);
    const fallback = () => { box.innerHTML = category().pic(item); };
    const photo = photoOf(item);
    if (!photo) { fallback(); return box; }

    // รูปใช้ object-fit: contain และ SVG ใช้ viewBox สัดส่วนเดียวกับรูป จึงย่อขยายตรงกันทุกขนาดกรอบ
    const wrap = el("div", "photo-wrap");
    const img = el("img");
    img.alt = "รูปภาพ"; // ไม่ใส่คำตอบ จะได้ไม่เฉลย
    img.draggable = false;
    let retried = false;
    img.addEventListener("error", () => {
      if (retried) return fallback();
      retried = true; // ลองโหลดใหม่อีกครั้งก่อน (เผื่อเน็ตสะดุด)
      setTimeout(() => { img.src = `${photo.src}${photo.src.includes("?") ? "&" : "?"}retry=1`; }, 1000);
    });
    img.src = photo.src;
    wrap.append(img);
    if (photo.mark) wrap.insertAdjacentHTML("beforeend", photoMark(photo.mark, photo.w, photo.h));
    box.append(wrap);
    return box;
  }

  function creditLink(item) {
    const photo = photoOf(item);
    if (!photo) return null;
    const link = el("a", "credit", "📷 ที่มาภาพ");
    link.href = photo.page;
    link.target = "_blank";
    link.rel = "noopener";
    return link;
  }

  // โหลดรูปของ 3 ข้อถัดไปไว้ล่วงหน้า
  function preloadUpcoming() {
    state.questions.slice(state.index + 1, state.index + 4).forEach((item) => {
      const photo = photoOf(item);
      if (photo) new Image().src = photo.src;
    });
  }

  // ---------- เสียง ----------
  let audioCtx = null;
  function playTone(freq, duration, delay = 0, type = "sine") {
    if (!state.soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.05);
    } catch (e) {}
  }
  const sounds = {
    correct() { playTone(660, 0.15); playTone(880, 0.25, 0.12); },
    wrong() { playTone(220, 0.3, 0, "triangle"); },
    letter() { playTone(990, 0.08); },
    finish() { [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.3, i * 0.15)); },
  };

  // อ่านออกเสียงภาษาอังกฤษด้วยเสียงของเบราว์เซอร์
  function speak(text) {
    if (!state.soundOn || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.85;
      const voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith("en"));
      if (voice) utter.voice = voice;
      speechSynthesis.speak(utter);
    } catch (e) {}
  }

  function speakButton(text, label = "🔊 ฟังเสียง") {
    const btn = el("button", "btn speak-btn", label);
    btn.addEventListener("click", () => speak(text));
    return btn;
  }

  // ---------- หน้าตั้งค่า ----------
  function renderSettings() {
    const c = category();
    $("start-mascot").textContent = c.emoji;
    $("start-title").textContent = `เกม${c.title}`;
    $("start-subtitle").textContent = c.subtitle;
    document.title = `เกม${c.title}`;

    const box = $("settings");
    box.innerHTML = "";
    // เปิดจากเว็บรวมเกม (?cat=...) เลือกหมวดมาแล้ว จึงไม่ต้องแสดงตัวเลือกหมวดซ้ำ
    const shown = SETTINGS.filter((s) => !(s.key === "cat" && state.catFromUrl));
    shown.forEach((setting, i) => {
      const section = el("div", "setting");
      section.append(el("p", "setting-label", `${i + 1}. ${setting.label.replace(/^\d+\.\s*/, "")}`));
      const options = el("div", "options" + (setting.grid ? " grid" : "") + (setting.grid === "two" ? " two" : ""));
      setting.options.forEach((opt) => {
        const btn = el("button", "btn option" + (state.settings[setting.key] === opt.value ? " selected" : ""));
        btn.append(el("span", "", opt.label));
        if (opt.sub) btn.append(el("small", "", opt.sub));
        btn.addEventListener("click", () => {
          state.settings[setting.key] = opt.value;
          saveSettings();
          renderSettings();
        });
        options.append(btn);
      });
      section.append(options);
      if (setting.key === "count") {
        const total = c.words.length;
        const n = state.settings.count;
        const note = n === 0 ? `เล่นครบทั้ง ${total} คำ` : n > total ? `หมวดนี้มี ${total} คำ จะเล่น ${total} ข้อ` : "";
        if (note) section.append(el("p", "setting-note", note));
      }
      box.append(section);
    });
  }

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); } catch (e) {}
  }

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
      SETTINGS.forEach(({ key, options }) => {
        if (options.some((o) => o.value === saved[key])) state.settings[key] = saved[key];
      });
    } catch (e) {}
    // เปิดจากเว็บรวมเกมด้วย ?cat=colors|body|verbs จะเข้าหมวดนั้นทันที
    const fromUrl = new URLSearchParams(location.search).get("cat");
    if (CATEGORIES[fromUrl]) {
      state.settings.cat = fromUrl;
      state.catFromUrl = true;
    }
  }

  // ---------- เริ่มเกม ----------
  function startGame() {
    const { count } = state.settings;
    const pool = shuffle([...category().words]);
    const n = count === 0 ? pool.length : Math.min(count, pool.length);
    state.questions = pool.slice(0, n);
    state.index = 0;
    state.score = 0;
    state.missed = [];
    state.round++;
    $("score").textContent = "0";
    showScreen("game");
    renderQuestion();
  }

  // ---------- แสดงคำถาม ----------
  function renderQuestion() {
    const item = state.questions[state.index];
    const type = state.settings.qtype;
    const c = category();
    state.firstTry = true;
    state.locked = false;

    $("counter").textContent = `ข้อ ${state.index + 1}/${state.questions.length}`;
    $("progress").style.width = `${(state.index / state.questions.length) * 100}%`;
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("meaning").textContent = "";

    const prompt = $("prompt");
    prompt.innerHTML = "";
    $("choices").innerHTML = "";
    $("choices").classList.toggle("hidden", type === "spell");
    $("spell").classList.toggle("hidden", type !== "spell");

    if (type === "pic") {
      prompt.append(picture(item, "picture"), el("div", "question-text", c.picQuestion));
      renderChoices(item, false);
    } else if (type === "word") {
      prompt.append(el("div", "word", item.display), el("div", "question-text", c.wordQuestion), speakButton(item.speakAs));
      renderChoices(item, true);
      speak(item.speakAs);
    } else {
      prompt.append(picture(item, "picture"), el("div", "thai", item.th), speakButton(item.speakAs));
      renderSpell(item);
    }
    preloadUpcoming();
  }

  // ตัวเลือกหลอก: ไม่เอาคำกลุ่มเดียวกัน และ (หมวดร่างกาย) ไม่เอาคำจากภาพพื้นฐานเดียวกัน
  function distractorsFor(item) {
    const words = category().words;
    const sceneOf = (w) => (BODY_PHOTOS[w.word] || [])[0];
    const sameScene = (w) => state.settings.cat === "body" && sceneOf(w) === sceneOf(item);
    const ok = (w) => w !== item && !(item.group && w.group === item.group) && !sameScene(w);
    let pool = words.filter(ok);
    if (pool.length < 3) pool = words.filter((w) => w !== item && !(item.group && w.group === item.group));
    return shuffle(pool).slice(0, 3);
  }

  function renderChoices(item, asPicture) {
    const options = shuffle([item, ...distractorsFor(item)]);
    options.forEach((w, i) => {
      const btn = el("button", "btn choice" + (asPicture ? " pic" : w.display.length > 9 ? " long" : ""));
      btn.append(el("span", "key", String(i + 1)));
      if (asPicture) btn.append(picture(w, "choice-pic"));
      else btn.append(document.createTextNode(w.display));
      btn.dataset.word = w.word;
      btn.addEventListener("click", () => checkChoice(btn, w === item));
      $("choices").append(btn);
    });
  }

  // สะกดคำ: แป้นมีเฉพาะตัวอักษรของคำนั้น (ไม่มีตัวหลอก) · เว้นวรรคและ ' แสดงให้อัตโนมัติ
  function renderSpell(item) {
    state.spellPos = 0;
    const slots = $("slots");
    const tiles = $("tiles");
    slots.innerHTML = "";
    tiles.innerHTML = "";
    const letters = [...item.word].filter((ch) => /[a-z]/.test(ch));
    slots.classList.toggle("long", item.word.length > 8);
    // แยกช่องเป็นกลุ่มตามคำ (และหลังขีด -) จะได้ขึ้นบรรทัดใหม่ระหว่างคำ ไม่ตัดกลางคำ
    item.word.split(" ").flatMap((w) => w.split(/(?<=-)/)).forEach((part) => {
      const group = el("span", "slot-word");
      [...part].forEach((ch) => {
        if (/[a-z]/.test(ch)) group.append(el("span", "slot letter"));
        else group.append(el("span", "slot fixed", ch));
      });
      slots.append(group);
    });

    const shuffled = [...letters];
    for (let i = 0; i < 10; i++) {
      shuffle(shuffled);
      if (shuffled.join("") !== letters.join("") || letters.length < 2) break;
    }
    shuffled.forEach((letter) => {
      const btn = el("button", "btn tile", letter);
      btn.dataset.letter = letter;
      btn.addEventListener("click", () => tapTile(btn));
      tiles.append(btn);
    });
    state.spellLetters = letters;
  }

  function setFeedback(text, kind) {
    const fb = $("feedback");
    fb.className = "feedback";
    void fb.offsetWidth;
    fb.textContent = text;
    fb.className = `feedback ${kind}`;
  }

  function showMeaning(item) {
    const box = $("meaning");
    box.textContent = `${item.display} = ${item.th} `;
    const credit = creditLink(item);
    if (credit) box.append(credit);
    if (item.example) box.append(el("span", "example", `“${item.example}” ${item.exampleTh}`));
  }

  // ---------- ตรวจคำตอบ ----------
  function checkChoice(btn, isCorrect) {
    if (state.locked || btn.disabled) return;
    if (isCorrect) {
      btn.classList.add("correct");
      document.querySelectorAll(".choice").forEach((b) => (b.disabled = true));
      answeredCorrectly();
    } else {
      state.firstTry = false;
      btn.classList.add("wrong");
      btn.disabled = true;
      setFeedback(pick(TRY_AGAIN), "bad");
      sounds.wrong();
    }
  }

  function tapTile(btn) {
    if (state.locked || btn.disabled) return;
    if (btn.dataset.letter === state.spellLetters[state.spellPos]) {
      btn.disabled = true;
      btn.classList.add("used");
      const slot = $("slots").querySelectorAll(".slot.letter")[state.spellPos];
      slot.textContent = btn.dataset.letter;
      slot.classList.add("filled");
      state.spellPos++;
      if (state.spellPos === state.spellLetters.length) answeredCorrectly();
      else sounds.letter();
    } else {
      wrongLetter(btn);
    }
  }

  function wrongLetter(btn) {
    state.firstTry = false;
    if (btn) {
      btn.classList.remove("wrong");
      void btn.offsetWidth;
      btn.classList.add("wrong");
      setTimeout(() => btn.classList.remove("wrong"), 400);
    }
    setFeedback("ยังไม่ใช่ตัวนี้ ลองตัวอื่นนะ 🤔", "bad");
    sounds.wrong();
  }

  function answeredCorrectly() {
    const item = state.questions[state.index];
    state.locked = true;
    if (state.firstTry) {
      state.score++;
      $("score").textContent = state.score;
    } else {
      state.missed.push(item);
    }
    setFeedback(pick(PRAISES), "good");
    showMeaning(item);
    sounds.correct();
    setTimeout(() => speak(item.speakAs), 300);
    const round = state.round;
    setTimeout(() => {
      if (round !== state.round) return;
      state.index++;
      if (state.index >= state.questions.length) endGame();
      else renderQuestion();
    }, item.example ? 2300 : 1600);
  }

  // ---------- สรุปผล ----------
  function endGame() {
    state.locked = true;
    state.round++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    const total = state.questions.length;
    const ratio = state.score / total;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
    $("progress").style.width = "100%";
    $("stars").innerHTML = [1, 2, 3].map((n) => `<span class="${n <= stars ? "" : "off"}" style="animation-delay:${n * 0.2}s">⭐</span>`).join("");
    $("result-score").textContent = `ตอบถูก ${state.score} จาก ${total} ข้อ`;
    const messages = {
      3: ["🏆", "สุดยอด! จำคำศัพท์ได้เยอะมากเลย"],
      2: ["🥳", "เก่งมาก! อีกนิดเดียวก็ได้ 3 ดาวแล้ว"],
      1: ["🤗", "พยายามได้ดีมาก! ทบทวนคำศัพท์แล้วลองใหม่นะ"],
    };
    $("result-mascot").textContent = messages[stars][0];
    $("result-msg").textContent = messages[stars][1];
    renderReview();
    showScreen("result");
    sounds.finish();
    launchConfetti(stars * 40);
  }

  function renderReview() {
    const box = $("review");
    box.innerHTML = "";
    if (state.missed.length === 0) {
      box.append(el("p", "perfect", "🌟 ไม่มีคำที่ต้องทบทวนเลย เก่งมาก!"));
      return;
    }
    box.append(el("h2", "", "📚 คำที่ควรทบทวน"));
    state.missed.forEach((item) => {
      const row = el("div", "review-row");
      const text = el("div");
      text.append(el("div", "r-word", item.display), el("div", "r-thai", item.th));
      const credit = creditLink(item);
      if (credit) text.append(credit);
      const btn = el("button", "btn speak-btn", "🔊");
      btn.addEventListener("click", () => speak(item.speakAs));
      row.append(picture(item, "r-pic"), text, btn);
      box.append(row);
    });
  }

  function launchConfetti(count) {
    const colors = ["#ff7a59", "#ffc93c", "#2fb874", "#4d8dff", "#9a6cff", "#f2506a"];
    for (let i = 0; i < count; i++) {
      const piece = el("div", "confetti");
      piece.style.left = `${Math.random() * 100}vw`;
      piece.style.background = pick(colors);
      piece.style.animationDuration = `${2 + Math.random() * 2}s`;
      piece.style.animationDelay = `${Math.random() * 0.8}s`;
      document.body.append(piece);
      setTimeout(() => piece.remove(), 5000);
    }
  }

  // ---------- ปุ่มต่าง ๆ ----------
  function goHome() {
    state.locked = true;
    state.round++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    renderSettings();
    showScreen("start");
  }

  $("start-btn").addEventListener("click", startGame);
  $("again-btn").addEventListener("click", startGame);
  $("settings-btn").addEventListener("click", goHome);
  $("home-btn").addEventListener("click", goHome);
  $("sound-btn").addEventListener("click", () => {
    state.soundOn = !state.soundOn;
    $("sound-btn").textContent = state.soundOn ? "🔊" : "🔇";
    if (!state.soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  // คีย์บอร์ด: 1–4 เลือกคำตอบ / พิมพ์ตัวอักษรเพื่อสะกดคำ
  document.addEventListener("keydown", (e) => {
    if (screens.game.classList.contains("hidden") || state.locked) return;
    if (state.settings.qtype === "spell") {
      const letter = e.key.toLowerCase();
      if (!/^[a-z]$/.test(letter)) return;
      const match = [...document.querySelectorAll(".tile:not(:disabled)")].find((t) => t.dataset.letter === letter);
      if (match) tapTile(match);
      else wrongLetter(null);
      return;
    }
    const btn = document.querySelectorAll(".choice")[Number(e.key) - 1];
    if (btn) btn.click();
  });

  loadSettings();
  renderSettings();
</script>
</body>
</html>
